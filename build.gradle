apply plugin: 'java'
apply plugin: 'eclipse'

eclipse.project.name = 'Software-Engineering-' 

sourceSets {
	main {
	  java {
		srcDirs = ['src']
	  }
	}
	test {
	  java {
	     srcDirs = ['test']
	  }
	 }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
	testImplementation('org.mockito:mockito-core:5.10.0')
	testImplementation ('fr.inria.gforge.spoon:spoon-core:11.0.0')
	implementation('com.google.code.gson:gson:2.13.1')
}

test {
    useJUnitPlatform()
    filter {
        excludeTestsMatching "test/TestDataStorageApiImplementation.java"
		excludeTestsMatching "test/TestDataStorageAPI.java"
		excludeTestsMatching "test/TestComputerAPI.java"
		excludeTestsMatching "test/ComputeEngineIntegrationTest.java"
    }
}