plugins {
    id 'java'
    id 'eclipse'
    id 'jacoco'
}

eclipse.project.name = 'Software-Engineering-'

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testRuntimeOnly('org.slf4j:slf4j-nop:1.7.36')
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    testImplementation('org.mockito:mockito-core:5.24.0')
    testImplementation('fr.inria.gforge.spoon:spoon-core:11.0.0')
    implementation('com.google.code.gson:gson:2.13.1')
    mockitoAgent('org.mockito:mockito-core:5.24.0') {
        transitive = false
    }
}

test {
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}