# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Gradle
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    # Configure Gradle for optimal use in GiHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
      
    - name: Check GitHub API rate limit
      run: |
        curl -sS -D - https://api.github.com/rate_limit -o /tmp/rate.json
        cat /tmp/rate.json
        
    - name: Diagnose GitHub check-runs API
      run: |
        curl -sS -D - -o /tmp/check-runs.json \
          https://api.github.com/repos/owenriegle/Software-Engineering/commits/0cbac31d3aa3b670d9991293d429d09c0f2fe938/check-runs
        cat /tmp/check-runs.json

    - name: Build with Gradle Wrapper
      run: chmod a+rwx gradlew; ./gradlew build

    - name: Diagnose pull request API after tests
      if: always()
      run: |
        echo "=== Rate limit ==="
        curl -sS -D - https://api.github.com/rate_limit
        echo ""
        echo "=== Pull request 11 commits ==="
        curl -sS -D - \
          https://api.github.com/repos/owenriegle/Software-Engineering/pulls/11/commits

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: build/reports/tests/test
    
